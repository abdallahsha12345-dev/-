<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>أمين أهدافي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');
  * { box-sizing: border-box; }
  body { margin:0; background:#14130f; font-family:'Tajawal',sans-serif; color:#EDE9E0; display:flex; justify-content:center; padding:24px 12px; min-height:100vh; }
  #app { width:100%; max-width:900px; border-radius:28px; padding:28px 30px; background:#1E1C17; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  h1 { font-family:'Cairo',sans-serif; font-weight:800; font-size:28px; margin:0 0 6px; color:#D9B34A; }
  .sub { font-size:13px; color:#9B9488; margin-bottom:22px; }
  .card { background:rgba(37,36,32,.7); border-radius:22px; padding:20px; margin-bottom:16px; }
  .sectionTitle { font-weight:700; font-size:15px; margin-bottom:14px; color:#D9B34A; }
  label { display:block; font-size:12px; color:#9B9488; margin-bottom:6px; }
  input, select, textarea { font-family:'Tajawal',sans-serif; background:rgba(30,28,23,.9); border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:12px 16px; color:#EDE9E0; font-size:14px; width:100%; }
  input:focus, select:focus, textarea:focus { outline:2px solid #C9A227; outline-offset:1px; }
  .btn { background:#D9B34A; border:none; border-radius:16px; padding:12px 22px; cursor:pointer; color:#1E1C17; font-family:'Tajawal',sans-serif; font-weight:700; font-size:14px; }
  .btn:hover { background:#E5C25E; }
  .btnGhost { background:rgba(201,162,39,.12); border:1px solid rgba(201,162,39,.35); color:#D9B34A; }
  .btnSm { padding:8px 14px; font-size:12.5px; border-radius:14px; }
  .row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .row > div { flex:1; min-width:120px; }
  .tabs { display:flex; gap:6px; margin-bottom:20px; background:rgba(37,36,32,.7); padding:5px; border-radius:22px; }
  .tabBtn { flex:1; padding:11px 6px; background:transparent; border:none; border-radius:18px; color:#B8B2A4; font-family:'Tajawal',sans-serif; font-weight:700; font-size:13px; cursor:pointer; transition:.25s; }
  .tabBtn.active { background:#3A3833; color:#D9B34A; }
  .goalRow { background:rgba(30,28,23,.7); border-radius:18px; padding:14px 16px; margin-bottom:10px; }
  .goalTop { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .goalName { font-weight:700; font-size:14px; }
  .goalNum { font-family:'JetBrains Mono',monospace; font-size:13px; color:#D9B34A; font-weight:700; }
  .track { height:9px; background:rgba(20,19,15,.9); border-radius:20px; overflow:hidden; }
  .fill { height:100%; background:linear-gradient(90deg,#C9A227,#E5C25E); border-radius:20px; transition:width .4s; }
  .counter { display:flex; align-items:center; gap:8px; }
  .counter button { width:34px; height:34px; border-radius:50%; border:1px solid rgba(201,162,39,.4); background:rgba(201,162,39,.1); color:#D9B34A; font-size:18px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .counter input { width:56px; text-align:center; padding:8px 4px; font-family:'JetBrains Mono',monospace; }
  .empty { color:#8A8478; font-size:13px; padding:22px 4px; text-align:center; }
  .hidden { display:none !important; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#D9B34A; color:#1E1C17; padding:12px 24px; border-radius:20px; font-weight:700; font-size:13.5px; z-index:99; opacity:0; transition:.3s; }
  .toast.show { opacity:1; }
  .studentCard { background:rgba(30,28,23,.7); border-radius:18px; padding:16px; margin-bottom:12px; cursor:pointer; transition:.2s; border:1px solid transparent; }
  .studentCard:hover { border-color:rgba(201,162,39,.4); }
  .studentName { font-weight:700; font-size:15px; color:#D9B34A; margin-bottom:4px; }
  .studentMeta { font-size:12px; color:#8A8478; font-family:'JetBrains Mono',monospace; }
  .codeBox { background:rgba(201,162,39,.12); border:1px dashed rgba(201,162,39,.45); border-radius:16px; padding:14px; text-align:center; margin-top:12px; }
  .codeVal { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:#D9B34A; letter-spacing:3px; }
  .backLink { color:#D9B34A; font-size:13px; cursor:pointer; margin-bottom:14px; display:inline-block; background:none; border:none; font-family:'Tajawal',sans-serif; font-weight:700; }
  .weekGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px; }
  .dayCell { text-align:center; padding:8px 2px; border-radius:12px; background:rgba(20,19,15,.7); font-size:10.5px; }
  .dayCell .n { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; color:#D9B34A; display:block; margin-top:3px; }
  .noteArea { min-height:80px; resize:vertical; line-height:1.7; }
  .stat { display:flex; gap:20px; flex-wrap:wrap; margin-top:12px; }
  .stat div { font-size:12px; color:#8A8478; }
  .stat b { display:block; font-family:'JetBrains Mono',monospace; font-size:19px; color:#D9B34A; margin-top:3px; }
  .del { background:none; border:none; color:#8A8478; cursor:pointer; font-size:16px; padding:2px 6px; }
  .del:hover { color:#E06C6C; }

  @media (max-width:768px) {
    body { padding:12px 8px; }
    #app { border-radius:20px; padding:18px 14px; }
    h1 { font-size:22px; }
    .card { padding:16px 14px; border-radius:18px; }
    .tabBtn { font-size:11.5px; padding:10px 3px; }
    input,select,textarea,.btn { font-size:13px; }
    .row { gap:8px; }
    .row > div { min-width:100%; }
    .weekGrid { gap:3px; }
    .dayCell { font-size:9.5px; padding:6px 1px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== شاشة الدخول ===== -->
  <div id="loginView">
    <h1>أمين أهدافي</h1>
    <div class="sub">رفيقك في حفظ القرآن ومتابعة أهدافك</div>

    <div class="card">
      <div class="sectionTitle">دخول الطالب</div>
      <label>الكود الخاص فيك</label>
      <input id="studentCode" placeholder="مثال: A7K2" maxlength="10" style="text-transform:uppercase" />
      <button class="btn" style="width:100%;margin-top:12px" onclick="studentLogin()">دخول</button>
    </div>

    <div class="card">
      <div class="sectionTitle">دخول المشرف</div>
      <label>كلمة المرور</label>
      <input id="adminPass" type="password" placeholder="••••••••" />
      <button class="btn btnGhost" style="width:100%;margin-top:12px" onclick="adminLogin()">دخول لوحة الإشراف</button>
    </div>
  </div>

  <!-- ===== واجهة الطالب ===== -->
  <div id="studentView" class="hidden">
    <h1 id="stName">—</h1>
    <div class="sub">سجّل إنجازك اليومي وتابع تقدّمك</div>
    <button class="backLink" onclick="logout()">← خروج</button>

    <div class="tabs">
      <button class="tabBtn active" data-t="today" onclick="stTab('today')">اليوم</button>
      <button class="tabBtn" data-t="week" onclick="stTab('week')">آخر ٧ أيام</button>
    </div>

    <div id="stToday">
      <div class="card">
        <div class="sectionTitle">أهدافي اليوم</div>
        <div id="goalsList"></div>
      </div>
      <div class="card">
        <div class="sectionTitle">ملاحظة اليوم</div>
        <textarea id="dayNote" class="noteArea" placeholder="كيف كان يومك مع القرآن؟"></textarea>
        <button class="btn btnGhost btnSm" style="margin-top:10px" onclick="saveNote()">حفظ الملاحظة</button>
      </div>
    </div>

    <div id="stWeek" class="hidden">
      <div class="card">
        <div class="sectionTitle">إنجازك آخر ٧ أيام</div>
        <div id="weekList"></div>
      </div>
    </div>
  </div>

  <!-- ===== لوحة المشرف ===== -->
  <div id="adminView" class="hidden">
    <h1>لوحة الإشراف</h1>
    <div class="sub">متابعة تقدّم الطلاب</div>
    <button class="backLink" onclick="logout()">← خروج</button>

    <div id="adminList">
      <div class="card">
        <div class="sectionTitle">إضافة طالب جديد</div>
        <div class="row">
          <div><label>اسم الطالب</label><input id="newStName" placeholder="مثال: محمد أحمد" /></div>
          <div style="flex:0 0 auto"><button class="btn" onclick="addStudent()">إضافة</button></div>
        </div>
        <div id="newCodeBox"></div>
      </div>

      <div class="card">
        <div class="sectionTitle">الطلاب</div>
        <div id="studentsList"><div class="empty">جارِ التحميل…</div></div>
      </div>
    </div>

    <div id="adminDetail" class="hidden">
      <button class="backLink" onclick="backToList()">← رجوع لقائمة الطلاب</button>
      <div class="card">
        <div class="sectionTitle" id="detName">—</div>
        <div id="detCode" class="studentMeta"></div>
        <div class="stat" id="detStats"></div>
      </div>

      <div class="card">
        <div class="sectionTitle">أهداف الطالب</div>
        <div class="row">
          <div><label>اسم الهدف</label><input id="gName" placeholder="مثال: حفظ" /></div>
          <div style="flex:0 0 90px"><label>المقدار</label><input id="gTarget" type="number" value="1" min="1" /></div>
          <div style="flex:0 0 110px"><label>الوحدة</label>
            <select id="gUnit"><option>صفحة</option><option>آية</option><option>وجه</option><option>جزء</option><option>دقيقة</option></select>
          </div>
          <div style="flex:0 0 auto"><button class="btn" onclick="addGoal()">إضافة</button></div>
        </div>
        <div id="detGoals" style="margin-top:14px"></div>
      </div>

      <div class="card">
        <div class="sectionTitle">سجل آخر ٧ أيام</div>
        <div id="detWeek"></div>
      </div>
    </div>
  </div>

</div>
<div id="toast" class="toast"></div>

<script>
const SB_URL = "https://itstutzdsrvzzjcqsmyv.supabase.co";
const SB_KEY = "sb_publishable_YKMn1lTLp5ZSjE5Sld3ygA_VOdhohYi";
const ADMIN_PASS = "2027مرقى@@2027";
const db = supabase.createClient(SB_URL, SB_KEY);

let me = null, curStudent = null;

/* ===== أدوات ===== */
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
function today() { return new Date().toISOString().slice(0,10); }
function dateOffset(n) { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function last7() { return Array.from({length:7},(_,i)=>dateOffset(-(6-i))); }
function dayLabel(s) { return new Date(s+"T00:00:00").toLocaleDateString("ar",{weekday:"short",day:"numeric"}); }
function show(id) { ["loginView","studentView","adminView"].forEach(v=>document.getElementById(v).classList.add("hidden")); document.getElementById(id).classList.remove("hidden"); }
function randCode() { const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; return Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join(""); }

/* ===== الدخول ===== */
async function studentLogin() {
  const code = document.getElementById("studentCode").value.trim().toUpperCase();
  if (!code) return toast("اكتب الكود");
  const { data, error } = await db.from("students").select("*").eq("code", code).maybeSingle();
  if (error || !data) return toast("الكود غير صحيح");
  me = data;
  localStorage.setItem("qt_code", code);
  document.getElementById("stName").textContent = "أهلاً " + data.name;
  show("studentView");
  loadStudentGoals();
  loadNote();
}
function adminLogin() {
  const p = document.getElementById("adminPass").value;
  if (p !== ADMIN_PASS) return toast("كلمة المرور خاطئة");
  localStorage.setItem("qt_admin", "1");
  show("adminView");
  loadStudents();
}
function logout() {
  localStorage.removeItem("qt_code"); localStorage.removeItem("qt_admin");
  me = null; curStudent = null;
  document.getElementById("studentCode").value = "";
  document.getElementById("adminPass").value = "";
  show("loginView");
}

/* ===== الطالب ===== */
function stTab(t) {
  document.querySelectorAll("#studentView .tabBtn").forEach(b=>b.classList.toggle("active", b.dataset.t===t));
  document.getElementById("stToday").classList.toggle("hidden", t!=="today");
  document.getElementById("stWeek").classList.toggle("hidden", t!=="week");
  if (t==="week") loadWeek();
}

async function loadStudentGoals() {
  const box = document.getElementById("goalsList");
  const { data: goals } = await db.from("goals").select("*").eq("student_id", me.id).order("created_at");
  if (!goals || !goals.length) { box.innerHTML = '<div class="empty">لم يضِف المشرف أهدافاً بعد</div>'; return; }
  const { data: prog } = await db.from("progress").select("*").eq("student_id", me.id).eq("date", today());
  const pmap = {}; (prog||[]).forEach(p => pmap[p.goal_id] = p);
  box.innerHTML = goals.map(g => {
    const v = pmap[g.id]?.value || 0;
    const pct = Math.min(100, Math.round(v/g.target*100));
    return `<div class="goalRow">
      <div class="goalTop">
        <span class="goalName">${g.name}</span>
        <span class="goalNum">${v} / ${g.target} ${g.unit}</span>
      </div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="counter" style="margin-top:10px">
        <button onclick="bump('${g.id}',-1)">−</button>
        <input type="number" id="v_${g.id}" value="${v}" min="0" onchange="setVal('${g.id}',this.value)" />
        <button onclick="bump('${g.id}',1)">+</button>
      </div>
    </div>`;
  }).join("");
}

async function bump(goalId, d) {
  const inp = document.getElementById("v_"+goalId);
  const nv = Math.max(0, (+inp.value||0) + d);
  await setVal(goalId, nv);
}
async function setVal(goalId, val) {
  val = Math.max(0, +val||0);
  const { data: ex } = await db.from("progress").select("id").eq("student_id",me.id).eq("goal_id",goalId).eq("date",today()).maybeSingle();
  if (ex) await db.from("progress").update({value:val}).eq("id",ex.id);
  else await db.from("progress").insert({student_id:me.id, goal_id:goalId, date:today(), value:val});
  toast("تم الحفظ");
  loadStudentGoals();
}

async function loadNote() {
  const { data } = await db.from("progress").select("note").eq("student_id",me.id).eq("date",today()).not("note","is",null).limit(1).maybeSingle();
  document.getElementById("dayNote").value = data?.note || "";
}
async function saveNote() {
  const txt = document.getElementById("dayNote").value;
  const { data: ex } = await db.from("progress").select("id").eq("student_id",me.id).eq("date",today()).limit(1).maybeSingle();
  if (ex) await db.from("progress").update({note:txt}).eq("id",ex.id);
  else await db.from("progress").insert({student_id:me.id, date:today(), note:txt, value:0});
  toast("تم حفظ الملاحظة");
}

async function loadWeek() {
  const box = document.getElementById("weekList");
  const dates = last7();
  const { data: goals } = await db.from("goals").select("*").eq("student_id", me.id);
  const { data: prog } = await db.from("progress").select("*").eq("student_id",me.id).gte("date",dates[0]);
  if (!goals || !goals.length) { box.innerHTML = '<div class="empty">لا توجد أهداف</div>'; return; }
  box.innerHTML = goals.map(g => {
    const cells = dates.map(d => {
      const p = (prog||[]).find(x=>x.goal_id===g.id && x.date===d);
      return `<div class="dayCell">${dayLabel(d)}<span class="n">${p?.value||0}</span></div>`;
    }).join("");
    return `<div class="goalRow"><div class="goalName">${g.name} <span style="color:#8A8478;font-size:12px">(${g.unit})</span></div><div class="weekGrid">${cells}</div></div>`;
  }).join("");
}

/* ===== المشرف ===== */
async function loadStudents() {
  const box = document.getElementById("studentsList");
  const { data } = await db.from("students").select("*").order("created_at",{ascending:false});
  if (!data || !data.length) { box.innerHTML = '<div class="empty">لا يوجد طلاب بعد</div>'; return; }
  box.innerHTML = data.map(s =>
    `<div class="studentCard" onclick="openStudent('${s.id}')">
      <div class="studentName">${s.name}</div>
      <div class="studentMeta">الكود: ${s.code}</div>
    </div>`).join("");
}

async function addStudent() {
  const name = document.getElementById("newStName").value.trim();
  if (!name) return toast("اكتب اسم الطالب");
  let code, ok = false;
  for (let i=0;i<8 && !ok;i++) {
    code = randCode();
    const { data } = await db.from("students").select("id").eq("code",code).maybeSingle();
    if (!data) ok = true;
  }
  const { error } = await db.from("students").insert({name, code});
  if (error) return toast("خطأ: " + error.message);
  document.getElementById("newStName").value = "";
  document.getElementById("newCodeBox").innerHTML =
    `<div class="codeBox">كود ${name}<div class="codeVal">${code}</div>
     <div style="font-size:11.5px;color:#8A8478;margin-top:6px">أرسل هذا الكود للطالب</div></div>`;
  loadStudents();
}

async function openStudent(id) {
  const { data } = await db.from("students").select("*").eq("id",id).single();
  curStudent = data;
  document.getElementById("adminList").classList.add("hidden");
  document.getElementById("adminDetail").classList.remove("hidden");
  document.getElementById("detName").textContent = data.name;
  document.getElementById("detCode").textContent = "الكود: " + data.code;
  loadDetGoals(); loadDetWeek();
}
function backToList() {
  document.getElementById("adminDetail").classList.add("hidden");
  document.getElementById("adminList").classList.remove("hidden");
  document.getElementById("newCodeBox").innerHTML = "";
}

async function addGoal() {
  const name = document.getElementById("gName").value.trim();
  const target = +document.getElementById("gTarget").value || 1;
  const unit = document.getElementById("gUnit").value;
  if (!name) return toast("اكتب اسم الهدف");
  await db.from("goals").insert({student_id:curStudent.id, name, target, unit});
  document.getElementById("gName").value = "";
  toast("تمت إضافة الهدف");
  loadDetGoals();
}

async function loadDetGoals() {
  const box = document.getElementById("detGoals");
  const { data } = await db.from("goals").select("*").eq("student_id",curStudent.id).order("created_at");
  if (!data || !data.length) { box.innerHTML = '<div class="empty">لا توجد أهداف</div>'; return; }
  box.innerHTML = data.map(g =>
    `<div class="goalRow"><div class="goalTop">
      <span class="goalName">${g.name}</span>
      <span><span class="goalNum">${g.target} ${g.unit}</span>
      <button class="del" onclick="delGoal('${g.id}')">✕</button></span>
    </div></div>`).join("");
}
async function delGoal(id) {
  if (!confirm("حذف هذا الهدف؟")) return;
  await db.from("goals").delete().eq("id",id);
  toast("تم الحذف"); loadDetGoals();
}

async function loadDetWeek() {
  const box = document.getElementById("detWeek");
  const dates = last7();
  const { data: goals } = await db.from("goals").select("*").eq("student_id",curStudent.id);
  const { data: prog } = await db.from("progress").select("*").eq("student_id",curStudent.id).gte("date",dates[0]);
  let totalDone = 0, totalTarget = 0, activeDays = new Set();
  (prog||[]).forEach(p => { if (p.value>0) { totalDone += p.value; activeDays.add(p.date); } });
  (goals||[]).forEach(g => totalTarget += g.target*7);
  document.getElementById("detStats").innerHTML =
    `<div>مجموع الإنجاز<b>${totalDone}</b></div>
     <div>أيام النشاط<b>${activeDays.size}/7</b></div>
     <div>عدد الأهداف<b>${(goals||[]).length}</b></div>`;

  if (!goals || !goals.length) { box.innerHTML = '<div class="empty">لا توجد أهداف</div>'; return; }
  let html = goals.map(g => {
    const cells = dates.map(d => {
      const p = (prog||[]).find(x=>x.goal_id===g.id && x.date===d);
      const v = p?.value||0;
      const col = v>=g.target ? "#D9B34A" : v>0 ? "#8A8478" : "#55524A";
      return `<div class="dayCell">${dayLabel(d)}<span class="n" style="color:${col}">${v}</span></div>`;
    }).join("");
    return `<div class="goalRow"><div class="goalName">${g.name}</div><div class="weekGrid">${cells}</div></div>`;
  }).join("");

  const notes = (prog||[]).filter(p=>p.note && p.note.trim());
  if (notes.length) {
    html += `<div style="margin-top:16px"><div class="sectionTitle" style="font-size:13.5px">ملاحظات الطالب</div>` +
      notes.map(n=>`<div style="border-bottom:1px solid rgba(255,255,255,.06);padding:9px 0;font-size:13px;color:#C9C4B8">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8478">${dayLabel(n.date)}</div>${n.note}</div>`).join("") + `</div>`;
  }
  box.innerHTML = html;
}

/* ===== استعادة الجلسة ===== */
(async function init(){
  if (localStorage.getItem("qt_admin")==="1") { show("adminView"); loadStudents(); return; }
  const code = localStorage.getItem("qt_code");
  if (code) {
    const { data } = await db.from("students").select("*").eq("code",code).maybeSingle();
    if (data) { me = data; document.getElementById("stName").textContent = "أهلاً " + data.name; show("studentView"); loadStudentGoals(); loadNote(); return; }
  }
  show("loginView");
})();
</script>
</body>
</html>
